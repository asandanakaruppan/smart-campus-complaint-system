services:
  db:
    image: postgres:16
    container_name: campus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_complaints
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus123
    ports:
      - "5432:5432"
    volumes:
      - campus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_complaints"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  campus_pgdata:
